name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate skill structure
        run: python3 scripts/validate_skill.py
